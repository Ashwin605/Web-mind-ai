<svg width="520" height="200" viewBox="0 0 520 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- VA Icon with orbital -->
  <g transform="translate(260, 50)">
    <!-- V shape -->
    <path d="M-40 0 L-20 40 L0 15 L20 40 L40 0" stroke="#E5E5E5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- A shape -->
    <path d="M0 15 L-15 50 M0 15 L15 50 M-10 35 L10 35" stroke="#E5E5E5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Orbital ring -->
    <ellipse cx="0" cy="20" rx="60" ry="35" stroke="rgba(139,92,246,0.25)" stroke-width="2" fill="none" transform="rotate(-12)"/>
    
    <!-- Sparkle -->
    <g transform="translate(50, -20)">
      <circle cx="0" cy="0" r="4" fill="#8B5CF6"/>
      <path d="M0 -8 L0 8 M-8 0 L8 0" stroke="#A78BFA" stroke-width="2" stroke-linecap="round">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
  
  <!-- WEBMIND Text -->
  <text x="60" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="300" letter-spacing="12" fill="#E5E5E5">WEBMIND</text>
  
  <!-- AI Text with gradient -->
  <text x="410" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="300" letter-spacing="6">
    <tspan fill="#E5E5E5">A</tspan>
    <tspan fill="#A78BFA">I</tspan>
  </text>
  
  <!-- Tagline with decorative lines -->
  <line x1="60" y1="170" x2="140" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="155" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="8" fill="rgba(255,255,255,0.5)">LEARN. BUILD. LAUNCH.</text>
  <line x1="405" y1="170" x2="460" y2="170" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
</svg>
